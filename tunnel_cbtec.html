<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IsabFE CBTEC</title>
  <link rel="icon" href="logo-anotdigi.png" type="image/png">
  <link rel="apple-touch-icon" href="logo-anotdigi.png">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; height: 100vh;
           margin: 0; background: #f0f4f8; color: #333; }
    .msg { font-size: 1.2rem; margin-bottom: 1rem; }
    .sub { font-size: 0.9rem; color: #666; }
  </style>
</head>
<body>
  <p class="msg">Conectando con CBTEC...</p>
  <p class="sub" id="estado">Obteniendo dirección del servidor...</p>
  <script>
    var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQvUkb91dYD80SsYX_JbVMEEn58eDE_PhX08jz2tE0dTtWn7A0Gp2lURbY553nApsj7LisNFxhHEFvm/pub?gid=0&single=true&output=csv";

    fetch(CSV_URL)
      .then(function(r) { return r.text(); })
      .then(function(txt) {
        var url = txt.split(",")[0].replace(/"/g, "").trim();
        if (url.indexOf("https://") === 0) {
          document.getElementById("estado").textContent = "Redirigiendo...";
          window.location.href = url + "/app";
        } else {
          document.getElementById("estado").textContent = "Servidor no disponible. Intentá más tarde.";
        }
      })
      .catch(function() {
        document.getElementById("estado").textContent = "Error al conectar. Verificá tu conexión.";
      });
  </script>
</body>
</html>
