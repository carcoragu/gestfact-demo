<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnotDigi — Informe de registros</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}

/* ── Header ── */
.header{background:#0f172a;padding:16px 20px;display:flex;align-items:center;gap:14px}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-placeholder{width:40px;height:40px;background:#0ea5e9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:800;color:#fff;flex-shrink:0}
.header-text h1{font-size:1rem;color:#fff;font-weight:700}
.header-text p{font-size:0.75rem;color:#94a3b8;margin-top:1px}
.badge-isasoft{margin-left:auto;font-size:0.65rem;background:rgba(14,165,233,0.15);border:1px solid rgba(14,165,233,0.3);color:#7dd3fc;padding:3px 8px;border-radius:50px;white-space:nowrap}

/* ── Summary cards ── */
.summary-row{display:flex;gap:12px;padding:16px;overflow-x:auto}
.sum-card{background:#fff;border-radius:12px;padding:14px 18px;min-width:130px;flex:1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sum-card .val{font-size:1.5rem;font-weight:800;color:#0f172a;line-height:1}
.sum-card .lbl{font-size:0.7rem;color:#64748b;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.sum-card.cobrado .val{color:#16a34a}
.sum-card.pendiente .val{color:#d97706}
.sum-card.total-gs .val{font-size:1.1rem}

/* ── Filtros ── */
.filtros{padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filtros input[type=date],.filtros select{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:0.8rem;color:#1e293b;outline:none}
.filtros input[type=date]:focus,.filtros select:focus{border-color:#0ea5e9}
.btn-filtrar{background:#0ea5e9;color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:0.8rem;font-weight:600;cursor:pointer}
.btn-limpiar{background:transparent;color:#64748b;border:1px solid #e2e8f0;border-radius:8px;padding:7px 12px;font-size:0.8rem;cursor:pointer}

/* ── Tabla desktop ── */
.tabla-wrap{padding:0 16px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
thead{background:#0f172a}
thead th{color:#94a3b8;font-size:0.68rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;padding:11px 14px;text-align:left;white-space:nowrap}
tbody tr{border-bottom:1px solid #f1f5f9;transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#f8fafc}
tbody td{padding:11px 14px;font-size:0.82rem;vertical-align:middle}
.td-fecha{color:#64748b;white-space:nowrap;font-size:0.78rem}
.td-chapa{font-family:monospace;font-weight:700;color:#0f172a;font-size:0.85rem;background:#f1f5f9;border-radius:5px;padding:2px 7px;white-space:nowrap}
.td-vehiculo{color:#475569;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-cliente{font-weight:600;color:#0f172a;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.td-servicio{color:#475569;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:0.78rem}
.td-monto{text-align:right;font-weight:700;white-space:nowrap;color:#0f172a}
.td-estado{text-align:center}
.badge-cobrado{background:#dcfce7;color:#16a34a;font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:50px;white-space:nowrap}
.badge-pendiente{background:#fef3c7;color:#b45309;font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:50px;white-space:nowrap}
.badge-verificar{background:#e0f2fe;color:#0369a1;font-size:0.68rem;font-weight:700;padding:3px 9px;border-radius:50px;white-space:nowrap}

/* ── Estado carga ── */
.estado-carga{text-align:center;padding:48px 20px;color:#64748b;font-size:0.9rem}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#0ea5e9;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#fff;border:1px solid #fecaca;border-radius:12px;padding:20px;margin:16px;text-align:center;color:#dc2626;font-size:0.85rem}
.vacio-box{background:#fff;border-radius:12px;padding:32px 20px;margin:16px;text-align:center;color:#94a3b8}

/* ── Pie ── */
.footer{text-align:center;padding:16px;font-size:0.72rem;color:#94a3b8}
.footer strong{color:#0ea5e9}

/* ── Móvil: ocultar columnas secundarias ── */
@media(max-width:600px){
    .col-vehiculo,.col-servicio{display:none}
    .summary-row{padding:12px}
    .sum-card{min-width:100px;padding:10px 12px}
    .sum-card .val{font-size:1.2rem}
    .tabla-wrap{padding:0 8px 20px}
    tbody td{padding:9px 10px}
    .td-cliente{max-width:100px}
}
</style>
</head>

  <input type="date" id="f-desde" title="Desde">
  <input type="date" id="f-hasta" title="Hasta">
  <select id="f-cliente"><option value="">Todos los clientes</option></select>
  <button class="btn-filtrar" onclick="aplicarFiltro()">Filtrar</button>
  <button class="btn-limpiar" onclick="limpiarFiltro()">Limpiar</button>
</div>

<div class="tabla-wrap">
  <div class="estado-carga" id="estado">
    <div class="spinner"></div><br>Cargando registros...
  </div>
  <table id="tabla" style="display:none">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Chapa</th>
        <th class="col-vehiculo">Vehículo</th>
        <th>Cliente</th>
        <th class="col-servicio">Servicio</th>
        <th style="text-align:right">Monto</th>
        <th style="text-align:center">Estado</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<div class="footer">
  Procesado por <strong>IsabSoft</strong> · AnotDigi V1
  <span id="footer-fecha"></span>
</div>

<script>
// ── Config ──
const ANOTDIGI_MAP = {
    miguel: {
        gfApi: 'https://script.google.com/macros/s/AKfycbxqMQhEAUsIY974xGf7KmnJ5zDtOJHnI9zavzpHr4vohcnMQPXBbFD_GujXL-XupBthkA/exec',
        nombre: 'Taller PCM — Miguel Acuña',
        inicial: 'M'
    }
};

const params   = new URLSearchParams(location.search);
const clienteId = (params.get('id') || 'miguel').toLowerCase();
const cfg       = ANOTDIGI_MAP[clienteId] || ANOTDIGI_MAP.miguel;
const GF_API    = cfg.gfApi;

document.getElementById('nombre-taller').textContent = cfg.nombre;
// logo embebido
document.getElementById('footer-fecha').textContent  = ' · ' + new Date().toLocaleDateString('es-PY');

// ── Helpers ──
async function fetchConTimeout(url, ms) {
    ms = ms || 10000;
    const ctrl = new AbortController();
    const tid  = setTimeout(function() { ctrl.abort(); }, ms);
    try {
        const r = await fetch(url, { signal: ctrl.signal });
        clearTimeout(tid);
        return r;
    } catch(e) {
        clearTimeout(tid);
        throw e;
    }
}

function parseCSV(texto) {
    const lineas = texto.split('\n').filter(l => l.trim());
    if (lineas.length < 2) return [];
    const headers = lineas[0].split(',').map(h => h.trim().toLowerCase());
    const idx = (n) => headers.indexOf(n);
    const iId = idx('id'), iCli = idx('cliente'), iVeh = idx('vehiculo'),
          iPat = idx('patente'), iFecha = idx('fecha'), iMonto = idx('monto'),
          iServ = idx('servicio'), iEstPres = idx('estado_pres'), iCobrado = idx('cobrado');

    // Fallback: si no hay header reconocido, usar índices históricos
    const useIdx = (primary, fallback) => primary >= 0 ? primary : fallback;

    return lineas.slice(1).map(l => {
        const c = l.split(',');
        return {
            id:        (c[useIdx(iId,0)]    || '').trim(),
            cliente:   (c[useIdx(iCli,1)]   || '').trim(),
            vehiculo:  (c[useIdx(iVeh,2)]   || '').trim(),
            patente:   (c[useIdx(iPat,3)]   || '').trim().toUpperCase().replace(/\s/g,''),
            fecha:     (c[useIdx(iFecha,4)] || '').trim(),
            monto:     parseInt(c[useIdx(iMonto,9)] || '0', 10) || 0,
            servicio:  (c[useIdx(iServ,7)]  || '').trim(),
            estadoPres:(c[useIdx(iEstPres,12)] || '').trim(),
            cobrado:   (c[useIdx(iCobrado,13)] || '').trim()
        };
    }).filter(r => r.id.startsWith('ANOTD-'));
}

function formatFecha(iso) {
    if (!iso) return '—';
    const m = iso.match(/(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${m[3]}/${m[2]}/${m[1]}` : iso;
}

function formatMonto(n) {
    if (!n || n <= 0) return '—';
    return 'Gs. ' + n.toLocaleString('es-PY');
}

function badgeEstado(r) {
    const c = (r.cobrado || '').trim();
    const ep = (r.estadoPres || '').trim().toLowerCase();
    if (c === '1' || ep === 'cobrado') return '<span class="badge-cobrado">✅ Cobrado</span>';
    if (ep === 'verificar')            return '<span class="badge-verificar">🔍 A verificar</span>';
    return '<span class="badge-pendiente">⏳ Pendiente</span>';
}

// ── Estado global ──
let todosLosRegistros = [];

function renderTabla(registros) {
    const tbody = document.getElementById('tbody');
    if (!registros.length) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:32px;color:#94a3b8">Sin registros para los filtros seleccionados</td></tr>`;
    } else {
        tbody.innerHTML = registros.map(r => `
        <tr>
          <td class="td-fecha">${formatFecha(r.fecha)}</td>
          <td><span class="td-chapa">${r.patente || '—'}</span></td>
          <td class="td-vehiculo col-vehiculo">${r.vehiculo || '—'}</td>
          <td class="td-cliente">${r.cliente || '—'}</td>
          <td class="td-servicio col-servicio" title="${r.servicio}">${r.servicio || '—'}</td>
          <td class="td-monto">${formatMonto(r.monto)}</td>
          <td class="td-estado">${badgeEstado(r)}</td>
        </tr>`).join('');
    }

    // Summary
    const total    = registros.length;
    const montoSum = registros.reduce((s,r) => s + (r.monto||0), 0);
    const cobrados = registros.filter(r => r.cobrado==='1' || (r.estadoPres||'').toLowerCase()==='cobrado').length;
    const pend     = total - cobrados;
    document.getElementById('s-total').textContent    = total;
    document.getElementById('s-monto').textContent    = montoSum > 0 ? montoSum.toLocaleString('es-PY') : '—';
    document.getElementById('s-cobrado').textContent  = cobrados;
    document.getElementById('s-pendiente').textContent= pend;
}

function poblarFiltroCliente(registros) {
    const clientes = [...new Set(registros.map(r => r.cliente).filter(Boolean))].sort();
    const sel = document.getElementById('f-cliente');
    clientes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        sel.appendChild(opt);
    });
}

function aplicarFiltro() {
    const desde   = document.getElementById('f-desde').value;
    const hasta   = document.getElementById('f-hasta').value;
    const cliente = document.getElementById('f-cliente').value;
    let r = todosLosRegistros;
    if (desde)   r = r.filter(x => (x.fecha || '') >= desde);
    if (hasta)   r = r.filter(x => (x.fecha || '') <= hasta);
    if (cliente) r = r.filter(x => x.cliente === cliente);
    renderTabla(r);
}

function limpiarFiltro() {
    document.getElementById('f-desde').value   = '';
    document.getElementById('f-hasta').value   = '';
    document.getElementById('f-cliente').value = '';
    renderTabla(todosLosRegistros);
}

// ── Carga principal ──
(async function cargar() {
    try {
        const res = await fetchConTimeout(GF_API + '?action=syncExportOrdenes');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const csv = await res.text();
        const registros = parseCSV(csv);

        // Ordenar por fecha desc
        registros.sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
        todosLosRegistros = registros;

        document.getElementById('estado').style.display      = 'none';
        document.getElementById('tabla').style.display       = '';
        document.getElementById('summary-row').style.display = '';
        document.getElementById('filtros').style.display     = '';

        poblarFiltroCliente(registros);
        renderTabla(registros);

        if (!registros.length) {
            document.getElementById('estado').innerHTML =
                '<div class="vacio-box">Sin registros AnotDigi cargados todavía.<br><small style="font-size:0.75rem;margin-top:6px;display:block">Los registros aparecen aquí cuando IsabSoft confirma la carga en GestFact.</small></div>';
            document.getElementById('estado').style.display = '';
        }
    } catch(e) {
        document.getElementById('estado').innerHTML =
            `<div class="error-box">No se pudo conectar con GestFact.<br><small>Verificá tu conexión e intentá recargar la página.</small></div>`;
    }
})();
</script>
</body>
</html>
