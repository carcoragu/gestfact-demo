<script>
// ═══════════════════════════════════════════
// FUNCIONES COPIADAS DE registro.html
// ═══════════════════════════════════════════

const NO_CHAPA_RE   = /^(MANO|CAMBIO|PASTILLA|BUJE|TORRETA|RULEMAN|CHAPISTA|CARDANCITO|RECTIF|AMORTIGUADOR|FRENO|ACEITE|FILTRO|RADIADOR|BOMBA|CABLE|GOMA|ROTULA|RETEN|SELLADO|AIRBAG|CORREA|TENSOR|POLEA|TAPON|VALVULA|DISCO|ZAPATA|CILINDRO|TERMINAL|CAPSULA|PERNO|TUERCA|GRASA|FLUIDO|LIQUIDO|TOTAL|FOLIO|RECAMBIO|REPUESTO|COSTO|LABOR|PAGO|SALDO|RESTO|DATO|NOTA)$/i;
const SIN_CARGO_RE  = /\b(sin\s+cargo|sin\s+costo|gratis|garant[ií]a|garantia|sin\s+cobro)\b/i;
const MARCAS_VEH_RE = /^(toyota|ford|honda|nissan|chevrolet|changan|fiat|volkswagen|vw|renault|peugeot|citroen|hyundai|kia|mercedes|bmw|audi|suzuki|mitsubishi|subaru|jeep|dodge|ram|gmc|mazda|lifan|geely|byd|jac|mg|haval|chery)\b/i;

function extraerVehiculoDeServicio(servicio) {
    for (const linea of (servicio || '').split('\n')) {
        const l = linea.trim();
        if (l && MARCAS_VEH_RE.test(l)) return l;
    }
    return '';
}

const CHAPA_INLINE_RE = /\b([A-Z]{2,5})\s?([A-Z]?\s?\d{3})\b/gi;
const FECHA_EN_LINEA_RE = /\b\d{1,2}\s*[\/\-]\s*\d{1,2}(?:\s*[\/\-]\s*\d{2,4})?\b|\b\d{1,2}\s+de\s+\w+\b/i;
const MESES_MAP = {enero:1,febrero:2,marzo:3,abril:4,mayo:5,junio:6,julio:7,agosto:8,septiembre:9,octubre:10,noviembre:11,diciembre:12};

function extraerChapaDeTexto(texto) {
    for (const linea of texto.split('\n')) {
        const m = linea.trim().match(/^([A-Z]{2,5})\s?([A-Z]?\s?\d{2,4})/i);
        if (m && !NO_CHAPA_RE.test(m[1].trim()))
            return (m[1] + m[2]).toUpperCase().replace(/\s/g, '');
    }
    return null;
}

function extraerFechaDeTexto(texto) {
    for (const linea of (texto || '').split('\n')) {
        const l = linea.trim();
        const m = l.match(/\b(\d{1,2})\s*\/\s*(\d{1,2})(?:\s*\/\s*(\d{2,4}))?\b/);
        if (m) {
            const dia = parseInt(m[1]), mes = parseInt(m[2]);
            if (dia >= 1 && dia <= 31 && mes >= 1 && mes <= 12) {
                const d = m[1].padStart(2,'0'), mo = m[2].padStart(2,'0');
                let y = m[3] || '26'; if (y.length === 2) y = '20' + y;
                return `${y}-${mo}-${d}`;
            }
        }
        const textoM = l.match(/\b(\d{1,2})\s+de\s+(\w+)(?:\s+(?:del?\s+)?(\d{2,4}))?\b/i);
        if (textoM) {
            const mes = MESES_MAP[(textoM[2]||'').toLowerCase()];
            if (mes) {
                const d = textoM[1].padStart(2,'0'), mo = String(mes).padStart(2,'0');
                let y = textoM[3] || '26'; if (y.length === 2) y = '20' + y;
                return `${y}-${mo}-${d}`;
            }
        }
    }
    return null;
}

function tieneMonto(texto) {
    return /\b\d{1,3}\.\d{3}\b|\b\d{5,}\b/.test(texto) || SIN_CARGO_RE.test(texto);
}

function parsearBloques(texto) {
    const jobs = [];
    const lineas = texto.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    let bloque = [];

    function extraerFechaDeLinea(linea) {
        const fechaM = linea.match(/(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?:\s*[\/\-]\s*(\d{2,4}))?/);
        if (fechaM) {
            const d = fechaM[1].padStart(2,'0'), m = fechaM[2].padStart(2,'0');
            let y = fechaM[3] || '26'; if (y.length === 2) y = '20' + y;
            return { val: `${y}-${m}-${d}`, dis: `${d}/${m}/${y}`, raw: fechaM[0] };
        }
        const textoM = linea.match(/\b(\d{1,2})\s+de\s+(\w+)(?:\s+(?:del?\s+)?(\d{2,4}))?\b/i);
        if (textoM) {
            const mes = MESES_MAP[(textoM[2]||'').toLowerCase()];
            if (mes) {
                const d = textoM[1].padStart(2,'0'), m = String(mes).padStart(2,'0');
                let y = textoM[3] || '26'; if (y.length === 2) y = '20' + y;
                return { val: `${y}-${m}-${d}`, dis: `${d}/${m}/${y}`, raw: textoM[0] };
            }
        }
        return null;
    }

    function procesarBloque(b) {
        while (b.length && !b[0].trim()) b.shift();
        while (b.length && !b[b.length-1].trim()) b.pop();
        if (!b.length) return;
        const primera = b[0];
        let chapaM = primera.match(/^([A-Z]{2,5})\s?([A-Z]?\s?\d{3})\b/i);
        if (!chapaM || NO_CHAPA_RE.test(chapaM[1].trim())) {
            if (FECHA_EN_LINEA_RE.test(primera)) {
                CHAPA_INLINE_RE.lastIndex = 0; let m;
                while ((m = CHAPA_INLINE_RE.exec(primera)) !== null)
                    if (!NO_CHAPA_RE.test(m[1].trim())) { chapaM = m; break; }
            }
        }
        const sinChapa = !chapaM || NO_CHAPA_RE.test((chapaM[1]||'').trim());
        const chapa    = sinChapa ? '' : (chapaM[1] + chapaM[2]).toUpperCase().replace(/\s/g,'');
        const fechaR   = extraerFechaDeLinea(primera);
        const fechaVal = fechaR ? fechaR.val : '';
        const fechaDis = fechaR ? fechaR.dis : '';
        let montoTotal = 0;
        b.forEach(l => {
            const ms = [...l.matchAll(/\b(\d{1,3})\.(\d{3})\b/g)];
            ms.forEach(mm => { montoTotal += parseInt(mm[1]+mm[2]); });
        });
        const notas    = /^(falta\s+cargar|hasta\s+ac[aá]\s+cargado|hasta\s+aca|falta|cargado)$/i;
        const esMontoRe = /^\d{1,3}(\.\d{3})+$/;
        const serv = b.slice(1).map(l=>l.trim()).filter(l=>l&&!notas.test(l)&&!esMontoRe.test(l)).join(' / ');
        let marcaRaw = sinChapa
            ? primera
            : (primera.slice(0, chapaM.index || 0) + primera.slice((chapaM.index || 0) + chapaM[0].length));
        if (fechaR) marcaRaw = marcaRaw.replace(fechaR.raw, ' ');
        const marcaModelo = marcaRaw.replace(/\b(falta\s+cargar|hasta\s+ac[aá]\s+cargado|hasta\s+aca|falta|cargado)\b/gi, '').replace(/\s+/g,' ').trim();
        jobs.push({ chapa, fechaVal, fechaDis, monto: montoTotal>0?String(montoTotal):'', servicio: serv, marcaModelo, sinChapa });
    }

    lineas.forEach(linea => {
        const t = linea.trim();
        const _cm = t.match(/^([A-Z]{2,5})\s?([A-Z]?\s?\d{3})\b/i);
        const comienzaConChapa = !!(_cm && !NO_CHAPA_RE.test(_cm[1].trim()));
        const tieneChapaYFecha = !comienzaConChapa && FECHA_EN_LINEA_RE.test(t) && (() => {
            CHAPA_INLINE_RE.lastIndex = 0; let m;
            while ((m = CHAPA_INLINE_RE.exec(t)) !== null)
                if (!NO_CHAPA_RE.test(m[1].trim())) return true;
            return false;
        })();
        if ((comienzaConChapa || tieneChapaYFecha) && bloque.length) { procesarBloque(bloque); bloque=[t]; }
        else bloque.push(t);
    });
    if (bloque.length) procesarBloque(bloque);
    return jobs;
}

// Validaciones (lógica pura, sin DOM)
function validar(jobs) {
    const sinChapa  = jobs.filter(j => !j.chapa);
    const sinMonto  = jobs.filter(j => !j.monto || parseInt(j.monto) <= 0);
    const sinFecha  = jobs.filter(j => !j.fechaVal);
    const sinServicio = jobs.filter(j => !j.servicio || !j.servicio.trim());
    const sinMarca    = jobs.filter(j => !j.marcaModelo || !j.marcaModelo.trim());
    const mismatch  = jobs.filter(j => {
        const ct = extraerChapaDeTexto(j.servicio);
        return ct && ct !== j.chapa;
    });
    return { sinChapa, sinMonto, sinFecha, sinServicio, sinMarca, mismatch };
}

// ═══════════════════════════════════════════
// TEST RUNNER
// ═══════════════════════════════════════════

let total = 0, passed = 0;
const suites = [];

function suite(name, fn) { const s={name,tests:[]}; suites.push(s); fn(s); }
function t(s, name, detail, ok, failMsg) {
    total++; if(ok) passed++;
    s.tests.push({name, detail, ok, failMsg: ok?null:failMsg});
}

// ─── SUITE 1: Parser — campos básicos ───
suite('Parser — campos básicos', s => {
    const jobs = parsearBloques(`AAZX033 toyota ractis 17/08
Rectificacion de frenos delantero 180.000
Cambio de pastilla
Mano de obra 300.000`);

    t(s,'Detecta 1 card','AAZX033', jobs.length===1, `cards=${jobs.length}`);
    t(s,'Chapa correcta','AAZX033', jobs[0]?.chapa==='AAZX033', `got="${jobs[0]?.chapa}"`);
    t(s,'Fecha 17/08 → 2026-08-17','',jobs[0]?.fechaVal==='2026-08-17',`got="${jobs[0]?.fechaVal}"`);
    t(s,'Monto 180k+300k = 480000','',jobs[0]?.monto==='480000',`got="${jobs[0]?.monto}"`);
    t(s,'Servicio incluye trabajo','',jobs[0]?.servicio.includes('Cambio de pastilla'),'no incluye');
});

// ─── SUITE 2: Parser — fechas especiales ───
suite('Parser — formatos de fecha', s => {
    const c1 = parsearBloques(`AAON696 vitz 21/ 07\nCambio aceite 50.000`);
    t(s,'Fecha con espacio "21/ 07"','→ 2026-07-21', c1[0]?.fechaVal==='2026-07-21', `got="${c1[0]?.fechaVal}"`);

    const c2 = parsearBloques(`AAZX031 vitz 20-8/26\nMano de obra 50.000`);
    t(s,'Fecha mixta "20-8/26"','→ 2026-08-20', c2[0]?.fechaVal==='2026-08-20', `got="${c2[0]?.fechaVal}"`);

    const c3 = parsearBloques(`AAZJ247 vitz 11 de junio\nAceite 50.000`);
    t(s,'Fecha texto "11 de junio"','→ 2026-06-11', c3[0]?.fechaVal==='2026-06-11', `got="${c3[0]?.fechaVal}"`);

    const c4 = parsearBloques(`AASL204 vitz 31/07/26\nMano de obra 290.000`);
    t(s,'Fecha con año "31/07/26"','→ 2026-07-31', c4[0]?.fechaVal==='2026-07-31', `got="${c4[0]?.fechaVal}"`);

    const c5 = parsearBloques(`AASL204 vitz 2/08/26\nMano de obra 50.000`);
    t(s,'Fecha día 1 dígito "2/08/26"','→ 2026-08-02', c5[0]?.fechaVal==='2026-08-02', `got="${c5[0]?.fechaVal}"`);
});

// ─── SUITE 3: Parser — chapa en mid-line ───
suite('Parser — chapa en medio de línea', s => {
    const jobs = parsearBloques(`Changan byb072 28/07/26\nCambio aceite 50.000`);
    t(s,'Detecta BYB072 en "Changan byb072 28/07"','', jobs.length===1,'no detectó card');
    t(s,'Chapa = BYB072','', jobs[0]?.chapa==='BYB072',`got="${jobs[0]?.chapa}"`);
    t(s,'Fecha 28/07 → 2026-07-28','', jobs[0]?.fechaVal==='2026-07-28',`got="${jobs[0]?.fechaVal}"`);
});

// ─── SUITE 4: Parser — filtro "notas" ───
suite('Parser — filtro de notas de gestión', s => {
    const c1 = parsearBloques(`AASL204 vitz 31/07/26 falta cargar\nAmortiguadores 290.000`);
    t(s,'"falta cargar" en encabezado — no aparece en servicio','',
        !c1[0]?.servicio.includes('falta'), `serv="${c1[0]?.servicio}"`);

    const c2 = parsearBloques(`AAOM941 vitz 28/08/26 hasta aca cargado\nCambio de radiador 240.000`);
    t(s,'"hasta aca cargado" filtrado del servicio','',
        !c2[0]?.servicio.includes('cargado'), `serv="${c2[0]?.servicio}"`);
});

// ─── SUITE 5: Parser — "Mano NNN" no divide bloque ───
suite('Parser — NO_CHAPA_RE en división de bloques', s => {
    const jobs = parsearBloques(`AANP018 toyota vitz 18/08/26
Cardancito de direccion
Pastilla de freno
Torreta 2
Mano 270.000`);
    t(s,'AANP018: "Mano 270.000" no crea bloque nuevo','→ 1 card', jobs.length===1, `cards=${jobs.length}`);
    t(s,'AANP018: monto = 270000','', jobs[0]?.monto==='270000', `got="${jobs[0]?.monto}"`);

    const j2 = parsearBloques(`AAON696 vitz 22/08\nBieleta 2\nMano de obra\n260.000`);
    t(s,'Monto en línea separada "260.000"','→ 260000', j2[0]?.monto==='260000', `got="${j2[0]?.monto}"`);
});

// ─── SUITE 6: Parser — chapa con espacios ───
suite('Parser — chapas con espacio', s => {
    const j1 = parsearBloques(`AAON 696 vitz 22/08\nPastilla 60.000`);
    t(s,'"AAON 696" → AAON696','', j1[0]?.chapa==='AAON696', `got="${j1[0]?.chapa}"`);

    const j2 = parsearBloques(`AAOM 941 vitz 17/08\nMano de obra 120.000`);
    t(s,'"AAOM 941" → AAOM941','', j2[0]?.chapa==='AAOM941', `got="${j2[0]?.chapa}"`);
});

// ─── SUITE 7: Parser — lista completa Miguel ───
suite('Parser — lista completa (13 cards de prueba)', s => {
    const lista = `AASL204 toyota vitz  31/07/26 falta cargar
Amortiguadores trasero 2
Torreta 2
Mantenimiento motor
Mano de obra 290.000

AARO223 toyota vitz 07/08 falta cargar
Torreta 1
Amortiguadores trasero 2
Cambio de bobinas 3
Mano de obra 170.000

AAON 696 toyota vitz 10/08 falta cargar
Amortiguador lado derecho
Mano de obra 100.000

AAON 699  toyota vitz 14/08
Cambio de pastilla
Mano de obra 60.000

AAZX033 toyota ractis 17/08
Rectificacion de frenos delantero 180.000
Cambio de pastilla
Amortiguador delannntero lado derecho 1
Mano de obra 300.000

AAOM 941 toyota vitz 17/08/26
Cellado de carter
Mano de obra 120.000

AARO223 toyota vitz 17/08/25
Cellado de carter
Mano de obra 120.000

AARS908 toyota ractis 18/08
Bujes 4
Precap 2
Pastilla
Torreta 2
Ruleman trasero 1
Mano de obra 420.000

AANP018 toyota vitz 18/08/26
Cardancito de direccion
Pastilla de freno
Torreta 2
Mano 270.000

AAZX031 toyota vitz 20-8/26
Chapista 350.000 para enderezar y colocar bien todo
Caño de agua 85.000
Mano de obra 50.000

AAON 696 toyota vitz 22/08
Bieleta 2
Pastilla 2
Bujes parilla
Mano de obra
260.000

AAOM 941 toyota vitz 28/08/26 hasta aca cargado
Cambio de radiador
Cambio de bomba y filtro de combustible
Mano de obra 240.000

AAON696 toyota vitz 2/08/26
Mantenimiento motor
Mano de obra 50.000 para anibal.`;

    const jobs = parsearBloques(lista);
    t(s,'Total: 13 cards','', jobs.length===13, `got=${jobs.length}`);
    t(s,'#1 AASL204 — monto 290000','', jobs[0]?.chapa==='AASL204'&&jobs[0]?.monto==='290000', `chapa=${jobs[0]?.chapa} monto=${jobs[0]?.monto}`);
    t(s,'#1 AASL204 — marcaModelo "toyota vitz"','', jobs[0]?.marcaModelo==='toyota vitz', `got="${jobs[0]?.marcaModelo}"`);
    t(s,'#5 AAZX033 — marcaModelo "toyota ractis"','', jobs[4]?.marcaModelo==='toyota ractis', `got="${jobs[4]?.marcaModelo}"`);
    t(s,'Todos los 13 tienen marcaModelo','', jobs.every(j=>j.marcaModelo && j.marcaModelo.trim()), `vacios: ${jobs.filter(j=>!j.marcaModelo).map(j=>j.chapa).join(',')}`);
    t(s,'#5 AAZX033 — monto 480000 (180k+300k)','', jobs[4]?.monto==='480000', `got=${jobs[4]?.monto}`);
    t(s,'#7 AARO223 — año 2025 detectado','', jobs[6]?.fechaVal==='2025-08-17', `got=${jobs[6]?.fechaVal}`);
    t(s,'#9 AANP018 — monto 270000 (Mano 270.000)','', jobs[8]?.monto==='270000', `got=${jobs[8]?.monto}`);
    t(s,'#10 AAZX031 — fecha 20-8/26 → 2026-08-20','', jobs[9]?.fechaVal==='2026-08-20', `got=${jobs[9]?.fechaVal}`);
    t(s,'#10 AAZX031 — monto 485000 (350k+85k+50k)','', jobs[9]?.monto==='485000', `got=${jobs[9]?.monto}`);
    t(s,'#11 AAON696 — monto 260000 (monto en línea sola)','', jobs[10]?.monto==='260000', `got=${jobs[10]?.monto}`);
    t(s,'#12 AAOM941 — "hasta aca cargado" filtrado','', !jobs[11]?.servicio.includes('cargado'), `serv=${jobs[11]?.servicio}`);
    t(s,'#13 AAON696 — fecha 2/08/26 → 2026-08-02','', jobs[12]?.fechaVal==='2026-08-02', `got=${jobs[12]?.fechaVal}`);
});

// ─── SUITE 8: Validaciones ───
suite('Validaciones — bloqueos', s => {
    const valid = [{chapa:'AAZX033',fechaVal:'2026-08-17',monto:'480000',servicio:'Cambio aceite'}];
    const v0 = validar(valid);
    t(s,'Card completo → sin bloqueos','', v0.sinChapa.length===0&&v0.sinMonto.length===0&&v0.sinFecha.length===0&&v0.mismatch.length===0,'tiene errores inesperados');

    const sinCh = [{chapa:'',fechaVal:'2026-08-17',monto:'100000',servicio:'Aceite'}];
    t(s,'Sin chapa → sinChapa detectado','', validar(sinCh).sinChapa.length===1, 'no detectó');

    const sinMo = [{chapa:'AAZX033',fechaVal:'2026-08-17',monto:'',servicio:'Aceite'}];
    t(s,'Sin monto → sinMonto detectado','', validar(sinMo).sinMonto.length===1, 'no detectó');

    const sinFe = [{chapa:'AAZX033',fechaVal:'',monto:'100000',servicio:'Aceite'}];
    t(s,'Sin fecha → sinFecha detectado','', validar(sinFe).sinFecha.length===1, 'no detectó');

    const mis = [{chapa:'AAZX033',fechaVal:'2026-08-17',monto:'100000',servicio:'AAON696 vitz\nCambio aceite'}];
    t(s,'Chapa en servicio diferente → mismatch detectado','AAON696 ≠ AAZX033', validar(mis).mismatch.length===1, 'no detectó mismatch');

    const noMis = [{chapa:'AAZX033',fechaVal:'2026-08-17',monto:'100000',servicio:'Cambio de aceite / Pastillas'}];
    t(s,'Servicio sin chapa → sin mismatch','', validar(noMis).mismatch.length===0, 'detectó mismatch incorrecto');

    const sinServ = [{chapa:'AAZX033',fechaVal:'2026-08-17',monto:'480000',marcaModelo:'toyota ractis',servicio:''}];
    t(s,'Sin trabajo → sinServicio detectado','', validar(sinServ).sinServicio.length===1, 'no detectó');

    const conServ = [{chapa:'AAZX033',fechaVal:'2026-08-17',monto:'480000',marcaModelo:'toyota ractis',servicio:'Cambio aceite'}];
    t(s,'Con trabajo → sin bloqueo sinServicio','', validar(conServ).sinServicio.length===0, 'detectó error incorrecto');

    const sinMar = [{chapa:'AAZX033',fechaVal:'2026-08-17',monto:'480000',marcaModelo:'',servicio:'Aceite'}];

// HELPERS ADICIONALES (DOM-free)
// ═══════════════════════════════════════════

function detectarClienteEnTextoArr(texto, clientes) {
    const opts = clientes.map(c => c.trim().toUpperCase()).filter(c => c.length >= 3);
    if (!opts.length) return null;
    const lineas = texto.split('\n').map(l => l.trim()).filter(l => l);
    for (const linea of lineas) {
        const up = linea.toUpperCase();
        if (/\d/.test(up)) continue;
        if (up.split(/\s+/).length > 5 || up.length < 3) continue;
        const match = opts.find(c => c === up || c.startsWith(up) || up.startsWith(c));
        if (match) return match;
    }
    return null;
}

function esClienteNuevoTest(nombre, registros, clientesDefault) {
    if (!nombre || !registros.length) return false;
    const up = nombre.toUpperCase().trim();
    if (clientesDefault.some(c => c.toUpperCase() === up)) return false;
    return !registros.some(r => r.cliente && r.cliente.toUpperCase() === up);
}

function chapaGetClienteTest(chapa, registros) {
    if (!chapa || !registros.length) return null;
    const cn = chapa.toUpperCase().replace(/\s/g,'');
    const entries = registros.filter(r => r.chapa === cn && r.cliente);
    return entries.length ? entries[entries.length-1].cliente : null;
}

// Mock localStorage DOM-free
function mockLS(datos) {
    const d = Object.assign({}, datos);
    return { getItem: k => d[k] || null };
}

const PLAN_LBL = { SESION: 'Sesión', BASICO: 'Básico', COMPLETO: 'Completo', FULL: 'Full' };
const PROMO_DIAS_T = 15;

function getPlanLabelT(ls)  { return PLAN_LBL[(ls.getItem('anotdigi_plan')||'').toUpperCase()] || 'Prueba'; }

function promoActivoT(ls) {
    const expiry = ls.getItem('anotdigi_expiry');
    if (expiry) return new Date(expiry) >= new Date();
    const inicio = ls.getItem('anotdigi_inicio');
    if (!inicio) return true;
    return Math.floor((new Date() - new Date(inicio)) / 86400000) < PROMO_DIAS_T;
}

function promoDiasT(ls) {
    const expiry = ls.getItem('anotdigi_expiry');
    const plan   = ls.getItem('anotdigi_plan');
    if (expiry && plan) {
        const d = Math.ceil((new Date(expiry) - new Date()) / 86400000);
        return { dias: Math.max(0, d), plan, esPlan: true };
    }
    const inicio = ls.getItem('anotdigi_inicio');
    if (!inicio) return { dias: PROMO_DIAS_T, plan: null, esPlan: false };
    const pasados = Math.floor((new Date() - new Date(inicio)) / 86400000);
    return { dias: Math.max(0, PROMO_DIAS_T - pasados), plan: null, esPlan: false };
}

function msgWizardT(chapa, marca, fecha, cliente, estado, plan) {
    return `${chapa} ${marca} | ${fecha} | ${cliente} | ${estado} | 📋 ${PLAN_LBL[plan] || plan}`;
}

function stripClientesT(jobs, lista) {
    lista = lista.map(c => c.trim().toUpperCase()).filter(c => c.length >= 3);
    jobs.forEach(j => {
        const eliminados = [];
        let marca = j.marcaModelo || '';
        lista.forEach(c => {
            const re = new RegExp('(?:^|\\s)' + c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(?:\\s|$)', 'gi');
            if (re.test(marca)) { eliminados.push(c); marca = marca.replace(re,' ').replace(/\s+/g,' ').trim(); }
        });
        j.marcaModelo = marca;
        const lineasServ = (j.servicio||'').split(' / ').map(l => {
            let linea = l.trim();
            lista.forEach(c => {
                const re = new RegExp('^' + c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '$', 'gi');
                if (re.test(linea)) { if (!eliminados.includes(c)) eliminados.push(c); linea = ''; }
            });
            return linea;
        }).filter(l => l);
        j.servicio = lineasServ.join(' / ');
        j.clientesEliminados = eliminados;
    });
    return jobs;
}

function computeFechaWarningT(fechaISO) {
    if (!fechaISO) return null;
    const hoy = new Date(); hoy.setHours(12,0,0,0);
    const d   = new Date(fechaISO + 'T12:00:00');
    if (d.getFullYear() !== hoy.getFullYear())
        return `Fecha del año ${d.getFullYear()} — ¿es correcto?`;
    const diff = Math.floor((hoy - d) / 86400000);
    if (diff > 60) return `Fecha de hace ${diff} días — verificá`;
    return null;
}

function chapaGetVehiculoT(chapa, registros) {
    if (!chapa || !registros.length) return null;
    const cn = chapa.toUpperCase().replace(/\s/g,'');
    const entries = registros.filter(r => r.chapa === cn && r.vehiculo);
    return entries.length ? entries[entries.length-1].vehiculo : null;
}

function recolectarWarningsBulkT(jobs, registros, clientesDefault) {
    const warns  = [];
    const conteo = {};
    jobs.forEach(j => { if (j.chapa) conteo[j.chapa] = (conteo[j.chapa]||0)+1; });
    jobs.forEach((j, i) => {
        const chapa = j.chapa || '?';
        const cn    = (j.chapa||'').toUpperCase().replace(/\s/g,'');
        if (j.fechaWarning)
            warns.push({ i, chapa, msg: j.fechaWarning, tipo: 'fecha' });
        const montoNum = parseInt(j.monto||'0', 10);
        if (!isNaN(montoNum) && montoNum < 0)
            warns.push({ i, chapa, msg: `Monto negativo (Gs. ${montoNum.toLocaleString('es-PY')}). ¿Es correcto?`, tipo: 'monto' });
        if (registros.some(r => r.chapa === cn && r.fecha === j.fechaVal))
            warns.push({ i, chapa, msg: 'Ya figura en GestFact con esta fecha.', tipo: 'duplicado' });
        const cliE = registros.filter(r => r.chapa === cn && r.cliente);
        const cGF  = cliE.length ? cliE[cliE.length-1].cliente : null;
        if (cGF && cGF !== (j.cliente||'').toUpperCase())
            warns.push({ i, chapa, msg: `Esta chapa habitualmente es de ${cGF}.`, tipo: 'cliente_chapa' });
        const esNuevo = j.cliente &&
            !clientesDefault.some(c => c.toUpperCase() === j.cliente.toUpperCase()) &&
            !registros.some(r => r.cliente && r.cliente.toUpperCase() === j.cliente.toUpperCase());
        if (esNuevo)
            warns.push({ i, chapa, msg: `${j.cliente} no está en GestFact — IsabSoft creará la ficha.`, tipo: 'cliente_nuevo' });
        if (j.chapa && conteo[j.chapa] > 1)
            warns.push({ i, chapa, msg: `Chapa repetida ${conteo[j.chapa]}x en esta lista.`, tipo: 'repetida' });
        const vE  = registros.filter(r => r.chapa === cn && r.vehiculo);
        const vGF = vE.length ? vE[vE.length-1].vehiculo : null;
        const vAct = (j.marcaModelo||'').toUpperCase().trim();
        if (vGF && vAct && !vAct.includes(vGF) && !vGF.includes(vAct))
            warns.push({ i, chapa, msg: `Vehículo diferente al historial: en GestFact figura como ${vGF}.`, tipo: 'vehiculo' });
    });
    return warns;
}

function dispatchPlanT(planId, warns) {
    if (planId === 'FULL'     && warns.length) return 'bloquea';
    if (planId === 'COMPLETO' && warns.length) return 'revision';
    return 'envia';
}

    t(s,'FULL + sin warns → envía','',        dispatchPlanT('FULL',     w0)==='envia',    `got="${dispatchPlanT('FULL',w0)}"`);
    t(s,'COMPLETO + warnings → revisión','',  dispatchPlanT('COMPLETO', w1)==='revision', `got="${dispatchPlanT('COMPLETO',w1)}"`);
    t(s,'COMPLETO + sin warns → envía','',    dispatchPlanT('COMPLETO', w0)==='envia',    `got="${dispatchPlanT('COMPLETO',w0)}"`);
    t(s,'BASICO + warnings → envía directo (cards muestran badges)','',
        dispatchPlanT('BASICO',   w1)==='envia', `got="${dispatchPlanT('BASICO',w1)}"`);
    t(s,'SESION + warnings → envía directo','',
        dispatchPlanT('SESION',   w1)==='envia', `got="${dispatchPlanT('SESION',w1)}"`);
    t(s,'(Prueba) + warnings → envía directo','',
        dispatchPlanT('',         w1)==='envia', `got="${dispatchPlanT('',w1)}"`);
});

// ─── SUITE 23: extraerMontoDeServicio ───
function extraerMontoDeServicioT(texto) {
    const m = (texto || '').match(/\b\d{1,3}(?:\.\d{3})+\b/g) || [];
    return m.reduce((sum, s) => sum + parseInt(s.replace(/\./g,''), 10), 0);
}

suite('extraerMontoDeServicio — suma montos del texto', s => {
    t(s,'un monto simple','',
        extraerMontoDeServicioT('Cambio aceite\nGs. 150.000') === 150000,
        'esperaba 150000');
    t(s,'dos montos → suma','',
        extraerMontoDeServicioT('Repuesto 80.000\nMano obra 150.000') === 230000,
        'esperaba 230000');
    t(s,'monto millonario','',
        extraerMontoDeServicioT('Motor 1.200.000') === 1200000,
        'esperaba 1200000');
    t(s,'texto "sin cargo" → 0','',
        extraerMontoDeServicioT('Sin cargo') === 0,
        'esperaba 0');
    t(s,'texto vacío → 0','',
        extraerMontoDeServicioT('') === 0,
        'esperaba 0');
    t(s,'null → 0','',
        extraerMontoDeServicioT(null) === 0,
        'esperaba 0');
    t(s,'número sin puntos de miles no cuenta','',
        extraerMontoDeServicioT('Km 82000') === 0,
        'no debería contar enteros sin puntos');
});

// ─── SUITE 24: Plan Full — cliente_nuevo no bloquea ───
suite('Plan Full — cliente_nuevo no bloquea, se auto-crea', s => {
    const wSoloCN = [{ tipo:'cliente_nuevo', msg:'X no está en GestFact' }];
    const wMixed  = [{ tipo:'cliente_nuevo', msg:'X' }, { tipo:'fecha', msg:'Fecha rara' }];
    const wFecha  = [{ tipo:'fecha', msg:'Fecha rara' }];
    const wVeh    = [{ tipo:'vehiculo', msg:'Vehículo distinto' }];

    const filtrar = (warns) => warns.filter(w => w.tipo !== 'cliente_nuevo');

    t(s,'FULL + solo cliente_nuevo → filtrado → envía','',
        dispatchPlanT('FULL', filtrar(wSoloCN)) === 'envia',
        `got="${dispatchPlanT('FULL', filtrar(wSoloCN))}"`);

    t(s,'FULL + cliente_nuevo + fecha → filtrado → bloquea por fecha','',
        dispatchPlanT('FULL', filtrar(wMixed)) === 'bloquea',
        `got="${dispatchPlanT('FULL', filtrar(wMixed))}"`);

    t(s,'FULL + solo fecha → bloquea','',
        dispatchPlanT('FULL', filtrar(wFecha)) === 'bloquea',
        `got="${dispatchPlanT('FULL', filtrar(wFecha))}"`);

    t(s,'FULL + vehiculo distinto → bloquea','',
        dispatchPlanT('FULL', filtrar(wVeh)) === 'bloquea',
        `got="${dispatchPlanT('FULL', filtrar(wVeh))}"`);

    t(s,'COMPLETO + solo cliente_nuevo → revisión previa (no se filtra en Completo)','',
        dispatchPlanT('COMPLETO', wSoloCN) === 'revision',
        `got="${dispatchPlanT('COMPLETO', wSoloCN)}"`);

    t(s,'filtrar() sobre lista vacía → sin warns','',
        filtrar([]).length === 0,
        'esperaba array vacío');

    t(s,'filtrar() solo elimina cliente_nuevo, respeta otros tipos','',
        filtrar([{ tipo:'cliente_nuevo' }, { tipo:'duplicado' }]).length === 1
        && filtrar([{ tipo:'cliente_nuevo' }, { tipo:'duplicado' }])[0].tipo === 'duplicado',
        'tipo incorrecto en resultado');
});

document.getElementById('ts').textContent = `Ejecutado: ${new Date().toLocaleString('es-PY')} — ${total} tests`;

const out = document.getElementById('results');
suites.forEach(s => {
    const div = document.createElement('div');
    div.className = 'suite';
    div.innerHTML = `<div class="suite-title">${s.name}</div>`;
    s.tests.forEach(test => {
        const row = document.createElement('div');
        row.className = 'test ' + (test.ok ? 'pass' : 'fail');
        row.innerHTML = `
            <span class="badge ${test.ok?'p':'f'}">${test.ok?'PASS':'FAIL'}</span>
            <div>
                <div class="test-name">${test.name}</div>
                ${test.detail ? `<div class="test-detail">${test.detail}</div>` : ''}
                ${!test.ok ? `<div class="test-fail-msg">✗ ${test.failMsg}</div>` : ''}
            </div>`;
        div.appendChild(row);
    });
    out.appendChild(div);
});

const sum = document.getElementById('summary');
sum.className = 'summary ' + (passed===total ? 'all-pass' : 'has-fail');
sum.textContent = passed===total
    ? `✅ ${passed}/${total} tests pasaron — todo OK`
    : `❌ ${passed}/${total} pasaron — ${total-passed} fallaron`;
