<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#0a1628"/>
<title>GestFact — Demo IsabSoft</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{height:-webkit-fill-available;}
body{background:#0a1628;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:100vh;min-height:-webkit-fill-available;min-height:100dvh;font-family:'Segoe UI',Arial,sans-serif;color:#e6edf3;}
.bg{position:fixed;inset:0;background:url('portada.jpg') center/cover no-repeat;}
.overlay{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(10,22,40,.3) 0%,rgba(10,22,40,.85) 55%,#0a1628 100%);}
.box{position:relative;z-index:2;width:100%;max-width:480px;padding:24px 32px 52px;display:flex;flex-direction:column;align-items:center;gap:16px;flex-shrink:0;}
.logo{width:88px;height:88px;object-fit:contain;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.5);}
.title{font-size:1.5rem;font-weight:800;text-align:center;}
.title span{color:#1e88e5;}
.sub{font-size:.82rem;color:#8b949e;text-align:center;margin-top:-8px;}
.badge{background:rgba(30,136,229,.15);border:1px solid #1e88e5;border-radius:10px;padding:12px 18px;font-size:.82rem;color:#8b949e;text-align:center;line-height:1.8;width:100%;}
.badge strong{color:#1e88e5;}
.spinner{width:40px;height:40px;border:3px solid rgba(30,136,229,.2);border-top-color:#1e88e5;border-radius:50%;animation:spin .8s linear infinite;margin:8px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:.72rem;color:#6e7681;}
</style>
</head>
<body>
<div class="bg"></div>
<div class="overlay"></div>
<div class="box">
  <img src="logo.png" class="logo" alt="IsabSoft"/>
  <div class="title">IsabSoft <span>GestFact</span></div>
  <div class="sub">Sistema de Gestión &amp; Facturación</div>
  <div class="badge"><strong>Modo Demo</strong><br/>Estás viendo una versión de demostración.<br/>Los datos no se guardan en ningún servidor.</div>
  <div class="spinner"></div>
  <div class="hint">Cargando demo...</div>
</div>
<script>
(function(){
  var cfg={key:'DEMO_001',nombre:'Demo IsabSoft',url:'YOUR_DEMO',demo:true,user:'admin',pass:'demo2026'};
  try{sessionStorage.setItem('gf_client_key',cfg.key);sessionStorage.setItem('gf_client_nombre',cfg.nombre);sessionStorage.setItem('gf_gestfact_url',cfg.url);sessionStorage.setItem('gf_user',cfg.user);sessionStorage.setItem('gf_pass',cfg.pass);}catch(e){}
  var _b64=btoa(unescape(encodeURIComponent(JSON.stringify(cfg))));
  window.location.replace('./index.html?v='+Date.now()+'#gfboot='+_b64);
})();
</script>
</body>
</html>
